<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Responsive premade HTML and CSS website layout by Itinerae. Designed for personal websites, Neocities and Nekoweb.">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&amp;family=Playfair+Display:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&amp;display=swap" rel="stylesheet">

<title>DEMO - Honey - cute HTML/CSS layout by Itinerae </title>


<style>
/*
This demo CSS is minified to prevent misuse.
The purchased version includes a clear, fully readable CSS file.
Buy this layout: ko-fi.com/itinerae/shop
*/
 :root{--bg:#f8f6f1 url(https://itinerae.neocities.org/bgs/dots.webp);
   --panel:#fdfbf6;
   --line:#e2dccf;
   --text:#918d84;
   --muted:#8c8578;
   --accent:#e8dfc8;--accent-2:#f1e7cc;
   --hover:#e4d8b5;
  }
  
  *{box-sizing:border-box}
  body{margin:0;
    padding:20px;
     background:#191919 fixed;
    color:var(--text);
    font-family:'IBM Plex Sans', tahoma, arial, sans-serif;
    font-size:10px;
    line-height:1.3;
    letter-spacing:1px;
    text-align:justify;
  }b{color:#ffc2d9}i{color:#a89a7a;font-style:italic}a{color:#87735e;text-decoration:none;transition:0.2s}a:hover{color:#8f7a3e}
  
  .icon{margin-right:px;opacity:0.7}
  .img-center {text-align: center;}
  .container{max-width:760px;margin:30px auto;
    background:var(--panel);border:1px solid var(--line);
    border-radius:5px;}
  .content{display:grid;
    grid-template-columns:2fr 1fr;}
  .left{border-right:1px solid var(--line)}
  .top-bar{display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 8px 5px;background:#fff;border-bottom:1px solid var(--line);
    border-radius:5px 5px 0 0;
    font:10px monospace;}.top-bar > div{flex:1}.top-bar > div:nth-child(1){text-align:left}.top-bar > div:nth-child(2){text-align:center}.top-bar > div:nth-child(3){text-align:right}.header{display:flex;align-items:center;gap:12px;padding:12px;background:#f6f2e8;border-bottom:1px solid var(--line);position:relative;overflow:hidden;}.header::before{content:"";position:absolute;inset:0;background:url(https://i.imgur.com/b4G4EpM.jpeg) center/cover no-repeat;opacity:0.25;}.header > *{position:relative}.profile-pic{width:120px;height:120px;flex-shrink:0;border-radius:50%;border:3px solid #f7a1c2;background:#fafafa url(https://64.media.tumblr.com/6a224feee6a496f480c3ad96fdb420a8/105b2cb549e2b085-5f/s540x810/1c6d10e28f4ed8f6b4a69e06be39d546392b2b5e.gif) center/cover;opacity:0.9;}.site-name{margin-bottom:5px;font:18px 'Playfair Display', Georgia;letter-spacing:2px;color:#f7a1c2;}.bubble{position:relative;font:italic 11px 'Crimson Text', Georgia;color:var(--muted);margin-top:10px;margin-bottom:10px;padding:12px 14px;background:rgba(255,255,255,0.5);border:1px solid #f7a1c2;border-radius:14px;}.bubble::after {content: "";position: absolute;left: -8px;top: 15px;width: 0;height: 0;border-top: 6px solid transparent;border-bottom: 6px solid transparent;border-right: 8px solid #f7a1c2;}.bubble::before {content: "";position: absolute;left: -6px;top: 16px;width: 0;height: 0;border-top: 5px solid transparent;border-bottom: 5px solid transparent;border-right: 7px solid #fff;}
  .nav{display:flex;background:var(--accent);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .nav a{flex:1 1 auto;min-width:100px;padding:6px 0 4px;text-align:center;text-transform:uppercase;letter-spacing:2px;font:10px monospace;border-right:1px solid #eee;}
  .nav a:last-child{border-right:none}
  .nav a:hover{background:var(--hover)}
  .box, .sidebar-box{border-top:1px solid var(--line);padding:8px 10px;}.box:first-child, .sidebar-box:first-child{border-top:none}.box-title{margin-bottom:5px;padding:2px 0;font:bold 12px arial;letter-spacing:2px;color:#b8a98a;border-bottom:1px dashed #dbd2c0;}.sidebar-title{margin-bottom:5px;padding:2px 0;font:bold 12px arial;letter-spacing:2px;color:#e8caa1;border-bottom:1px dashed #e8caa1;}.half-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;margin-bottom:4px;}.half-box{padding:6px;background:#fdfbf6;border:1px solid var(--line);}.list{list-style:none;padding:0;margin:0;}.list li{padding:4px 2px;font-size:11px;border-bottom:1px solid #e6e1d8;}.footer-nav{display:flex;background:#f2eee6;border-top:1px solid var(--line);}.footer-nav a{flex:1;padding:6px 0;text-align:center;border-right:1px solid var(--line);}.footer-nav a:last-child{border-right:none}.footer-text{padding:10px 0;text-align:center;letter-spacing:0.5px;color:var(--muted);background:var(--accent-2);border-top:1px solid var(--line);}@media(max-width:600px){.content{grid-template-columns:1fr}.left{border-right:none}.header{flex-direction:column;text-align:center}.nav{flex-direction:column}.nav a{border-right:none;border-bottom:1px solid #eee}.top-bar > div:first-child, .top-bar > div:last-child{display:none;}.top-bar > div:nth-child(2){text-align:center;flex:1;}.bubble::before, .bubble::after{display:none;}}
</style>
</head>

<body>



<div class="container">
    
      


<div class="top-bar">
    
  <div><img src="https://64.media.tumblr.com/95e604b03371c1c0d382a8c54dee631c/a36ad49322e4f3ba-b8/s75x75_c1/97d9929d44f694ed121471233c45a8562a2b8ee9.gif" class="icon" alt="x"> </div>
  <div><img src="https://itinerae.neocities.org/pixels/date.webp" class="icon" alt="x"> <span id="date-text">Saturday, Nov 7, 2026 • 2:10 AM</span></div>
  <div><img src="https://itinerae.neocities.org/pixels/warning.gif" class="icon" alt="x"> <b>Updated</b> 04/05/2026</div>
  
</div>   


<div class="header">
  <div class="profile-pic"></div>
  <div>
    <div class="site-name">Welcome, Mighty Atom ! </div>
    <div class="bubble">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nulla id justo ex. Nunc tristique mattis nibh ut porta. Donec odio nulla, euismod gravida ullamcorper vel, bibendum a dui. 
    </div>
  </div>
</div>








</div>   <!-- .container ends -->



<script>
function updateDateTime(){
  const now=new Date();
  let h=now.getHours();
  let m=now.getMinutes();
  const ampm=h>=12?'PM':'AM';
  h=h%12||12;
  m=m<10?'0'+m:m;
  const d=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById('date-text').textContent=`${d[now.getDay()]}, ${mo[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()} • ${h}:${m} ${ampm}`;
}
updateDateTime();
setInterval(updateDateTime,1000);
</script>




</body></html>
